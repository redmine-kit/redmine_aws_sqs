# What Redmine Kit AWS SQS adds to Redmine Kit's new UI (redmine_kit_ui's docs/plugins-kit.md, "The manifest"): the tab
# Jobs of Administration › AWS (AwsSqsJobs, at the route of Redmine's tab), on the page of redmine_kit_aws's admin menu
# item aws, at the position of its register_tab (docs/api.md of redmine_kit_aws, "The new UI"). Who may open it is the
# controller's (require_admin).
api_version: 1
module: kit/sqs.js
stylesheet: kit/sqs.css
screens:
  - { path: /admin/aws/jobs, component: AwsSqsJobs, layout: admin, menu_item: aws, title: label_aws, tab: label_aws_sqs_jobs, position: 20 }
