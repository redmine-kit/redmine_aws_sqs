# Services for the tests (bin/test). No host ports. The plugin's tests run on
# the internal network, which cannot reach AWS
# (test/integration/network_test.rb fails if they can); Redmine's own tests,
# which call no AWS API but resolve names on the internet (webhooks), run on
# the default network.
networks:
  internal:
    internal: true

services:
  postgres:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    networks: [internal, default]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  # SQS for the integration tests: AWS Emulator (test/aws-emulator/Dockerfile).
  # Its certificate names only 127.0.0.1 and localhost, so the tests run in
  # its network namespace and reach it on https://127.0.0.1:9297, trusting
  # the certificate it writes to the volume at each start (bin/test).
  # Authentication is off: the tests sign with fixed keys.
  aws-emulator:
    build: aws-emulator
    image: redmine-aws-sqs-test-aws-emulator
    pull_policy: build
    command: ["--auth", "off"]
    networks: [internal]
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - aws-emulator:/home/emulator/.aws/emulator
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://127.0.0.1:9297/__admin/health"]
      interval: 1s
      retries: 30

  # Headless Chromium for the screenshots of the docs (bin/screenshots), only
  # with the "screenshots" profile. Multi-architecture, so it runs on arm64 too.
  chrome:
    image: selenium/standalone-chromium:155.0-chromedriver-155.0-grid-4.51.0-20261010@sha256:c7c17cd79c62819a8329df00e610dbc4073c279da034a6f37135d454eb0d8870
    profiles: ["screenshots"]
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 2s
      retries: 60

volumes:
  aws-emulator:
