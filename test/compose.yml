# Services for the tests (bin/test). No host ports: the tests run in a
# container on the same network.
services:
  postgres:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  # SQS for the integration tests.
  moto:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/')"]
      interval: 2s
      retries: 30

  # LocalStack, when LOCALSTACK_AUTH_TOKEN is set (bin/services turns on the
  # "localstack" profile; bin/test then uses it instead of moto). The token is
  # never written to the repository.
  localstack:
    image: localstack/localstack:2026.10.6@sha256:f94401988db4c01a5b2634d37d698a9b11c93f74c1ad0f7a8849f5ebd73dcbdc
    profiles: ["localstack"]
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      # Queue URLs on the host the tests call (localstack), not localhost.
      SQS_ENDPOINT_STRATEGY: path
    # The image has its own health check.
