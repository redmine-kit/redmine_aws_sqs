name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The Rubies of Redmine 7.0 (3.2 to 4.0), pinned in
        # test/ruby-<version>.Dockerfile.
        ruby: ["3.2", "4.0"]
    env:
      TEST_RUBY: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/lint

  test:
    needs: lint
    name: test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    # id-token: Codecov's upload with OIDC, without a token secret.
    permissions:
      contents: read
      id-token: write
    env:
      TEST_RUBY: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # redmine_aws, which the plugin requires, until the tests install its
      # gem. The plugin's .dockerignore keeps it out of the plugin's image.
      - uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_aws
          path: redmine_aws
          persist-credentials: false
      # The plugin's tests, then every Redmine test with the plugin installed.
      # LocalStack when the organization's secret is available (not on pull
      # requests from forks); moto otherwise. The log names the backend.
      - run: bin/test --redmine
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          REDMINE_AWS_DIR: redmine_aws
      # The plugin's coverage (coverage/coverage.xml, written by bin/test).
      # Not failing the run while the Codecov app is not installed.
      - if: matrix.ruby == '4.0'
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: coverage/coverage.xml
          fail_ci_if_error: false
      - if: always()
        run: bin/services --down
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
